<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Blog Post - Songeam Kanha's Blog" />
  <title>Blog Post | Songeam Kanha's Blog</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Songeam Kanha</h1>
      <p class="subtitle">AI/ML Engineer & Developer</p>
      <nav>
        <a href="../../index.html">Home</a>
        <a href="../../portfolio/index.html">Portfolio</a>
        <a href="../index.html" class="active">Blog</a>
        <a href="../../index.html#contact">Contact</a>
        <a href="../../admin/index.html" style="color: var(--primary-color);">
          <i class="fas fa-cog"></i> Admin
        </a>
      </nav>
    </div>
  </header>

  <main>
    <article class="blog-post">
      <div class="blog-post-content">
        <!-- Content will be loaded by JavaScript -->
        <p>Loading...</p>
      </div>
    </article>
  </main>

  <footer>
    <div class="footer-content">
      <p>© 2024 Songeam Kanha. All rights reserved.</p>
      <p>Built with ❤️ and shared on GitHub</p>
    </div>
  </footer>

  <script src="../../assets/js/admin-config.js"></script>
  <script src="../../assets/js/admin-link-handler.js"></script>
  <script src="../../assets/js/data-manager.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Load blog post
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize DataManager
      if (typeof DataManager !== 'undefined') {
        DataManager.init();
      }
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');
      
      if (!postId) {
        document.querySelector('.blog-post-content').innerHTML = `
          <h1>Post Not Found</h1>
          <p>The blog post you're looking for doesn't exist.</p>
          <a href="../index.html">← Back to Blog</a>
        `;
        return;
      }

      const post = DataManager.getBlogPost(postId);
      if (!post) {
        document.querySelector('.blog-post-content').innerHTML = `
          <h1>Post Not Found</h1>
          <p>The blog post you're looking for doesn't exist.</p>
          <a href="../index.html">← Back to Blog</a>
        `;
        return;
      }

      // Update page title
      document.title = `${post.title} | Songeam Kanha's Blog`;

      // Format date
      function formatDate(dateString) {
        if (!dateString) return '';
        try {
          const date = new Date(dateString);
          return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        } catch (e) {
          return dateString;
        }
      }

      // Escape HTML
      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Render post
      const container = document.querySelector('.blog-post-content');
      container.innerHTML = `
        <header>
          <h1>${escapeHtml(post.title)}</h1>
          <div class="post-meta">
            <span class="date">${formatDate(post.date)}</span>
            <span class="author">By ${escapeHtml(post.author || 'Songeam Kanha')}</span>
          </div>
        </header>
        <div class="post-content markdown-content">${escapeHtml(post.content)}</div>
        <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
          <a href="../index.html" style="color: var(--primary-color); text-decoration: none;">
            ← Back to Blog
          </a>
        </div>
      `;

      // Process markdown
      if (typeof marked !== 'undefined') {
        const markdownEl = container.querySelector('.markdown-content');
        if (markdownEl) {
          const markdown = markdownEl.textContent;
          markdownEl.innerHTML = marked.parse(markdown);
        }
      }
    });
  </script>
</body>
</html>
