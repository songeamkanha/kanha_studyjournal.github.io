<!--
  Blog home page listing all posts
  ➕ Add new post links below.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Songeam Kanha's Blog - AI/ML Engineer and Developer sharing insights and knowledge" />
  <title>Blog | Songeam Kanha</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Songeam Kanha</h1>
      <p class="subtitle">AI/ML Engineer & Developer</p>
      <nav>
        <a href="../index.html">Home</a>
        <a href="../portfolio/index.html">Portfolio</a>
        <a href="index.html" class="active">Blog</a>
        <a href="../index.html#contact">Contact</a>
        <a href="../admin/index.html" style="color: var(--primary-color);">
          <i class="fas fa-cog"></i> Admin
        </a>
      </nav>
    </div>
  </header>

  <main>
    <section class="latest-blog">
      <h2>Blog Posts</h2>
      <div class="card-list" id="blog-posts-list">
        <!-- Blog posts will be loaded dynamically -->
        <div style="text-align: center; padding: 2rem; color: var(--light-text);">
          Loading blog posts...
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p>© 2024 Songeam Kanha. All rights reserved.</p>
      <p>Built with ❤️ and shared on GitHub</p>
    </div>
  </footer>

  <script src="../assets/js/admin-config.js"></script>
  <script src="../assets/js/admin-link-handler.js"></script>
  <script src="../assets/js/data-manager.js"></script>
  <script src="../assets/js/content-loader.js"></script>
  <script>
    // Load blog posts
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof DataManager !== 'undefined') {
        DataManager.init();
      }
      ContentLoader.loadBlogPosts();
    });
  </script>
</body>
</html>
